services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    init: true
    ports:
      - "127.0.0.1:${OMNIFETCH_API_PORT:-8000}:8000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1536m
    cpus: 2.0
    stop_grace_period: 30s
    volumes:
      - omnifetch-data:/data
      - type: bind
        source: "${OMNIFETCH_COOKIE_FILE_HOST:-./secrets/disabled.cookies.txt}"
        target: /run/secrets/omnifetch-cookies.txt
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1770
    environment:
      OMNIFETCH_DOWNLOAD_DIR: /data/downloads
      OMNIFETCH_FRONTEND_DIR: /app/frontend
      OMNIFETCH_MAX_FILESIZE_MB: "${OMNIFETCH_MAX_FILESIZE_MB:-1024}"
      OMNIFETCH_MAX_DURATION_MIN: "${OMNIFETCH_MAX_DURATION_MIN:-120}"
      OMNIFETCH_MAX_CONCURRENT_JOBS: "${OMNIFETCH_MAX_CONCURRENT_JOBS:-2}"
      OMNIFETCH_MAX_QUEUED_JOBS: "${OMNIFETCH_MAX_QUEUED_JOBS:-8}"
      OMNIFETCH_JOB_TIMEOUT_SECONDS: "${OMNIFETCH_JOB_TIMEOUT_SECONDS:-1800}"
      OMNIFETCH_JOB_TTL_HOURS: "${OMNIFETCH_JOB_TTL_HOURS:-6}"
      OMNIFETCH_CLEANUP_INTERVAL_SECONDS: "${OMNIFETCH_CLEANUP_INTERVAL_SECONDS:-600}"
      OMNIFETCH_MAX_BODY_BYTES: "${OMNIFETCH_MAX_BODY_BYTES:-8192}"
      OMNIFETCH_MAX_URL_LENGTH: "${OMNIFETCH_MAX_URL_LENGTH:-4096}"
      OMNIFETCH_SOCKET_TIMEOUT_SECONDS: "${OMNIFETCH_SOCKET_TIMEOUT_SECONDS:-15}"
      OMNIFETCH_TERMINATE_GRACE_SECONDS: "${OMNIFETCH_TERMINATE_GRACE_SECONDS:-3}"
      OMNIFETCH_MAX_WORKER_EVENT_BYTES: "${OMNIFETCH_MAX_WORKER_EVENT_BYTES:-262144}"
      OMNIFETCH_MAX_COOKIE_FILE_BYTES: "${OMNIFETCH_MAX_COOKIE_FILE_BYTES:-1048576}"
      OMNIFETCH_PUBLIC_MODE: "${OMNIFETCH_PUBLIC_MODE:-false}"
      OMNIFETCH_ALLOW_GENERIC_EXTRACTOR: "${OMNIFETCH_ALLOW_GENERIC_EXTRACTOR:-false}"
      OMNIFETCH_ENABLE_AUTHENTICATED_MEDIA: "${OMNIFETCH_ENABLE_AUTHENTICATED_MEDIA:-false}"
      OMNIFETCH_COOKIE_FILE: /run/secrets/omnifetch-cookies.txt
      OMNIFETCH_ALLOWED_PORTS: "${OMNIFETCH_ALLOWED_PORTS:-80,443}"
      OMNIFETCH_ALLOWED_ORIGINS: "${OMNIFETCH_ALLOWED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}"
      OMNIFETCH_FFMPEG_LOCATION: "${OMNIFETCH_FFMPEG_LOCATION:-}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  omnifetch-data:
