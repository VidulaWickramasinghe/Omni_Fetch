<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">OmniFetch Phase 1 architecture</title>
  <desc id="desc">The browser sends same-origin requests to FastAPI. Policy and metadata extraction validate the request before bounded job admission. An isolated worker runs yt-dlp and FFmpeg and writes to a per-job directory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1017"/>
      <stop offset="1" stop-color="#111a25"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172330"/>
      <stop offset="1" stop-color="#101822"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#7be0ca"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="1280" height="650" rx="26" fill="url(#bg)"/>
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="64" y="70" fill="#f4f7f8" font-size="30" font-weight="750">How one download moves through OmniFetch</text>
    <text x="64" y="101" fill="#a7b3be" font-size="16">A single-process control plane with killable child workers and isolated local storage</text>

    <g transform="translate(64 150)" filter="url(#shadow)">
      <rect width="205" height="154" rx="20" fill="url(#panel)" stroke="#385063" stroke-width="2"/>
      <rect x="20" y="21" width="52" height="52" rx="14" fill="#ff9557" fill-opacity=".13"/>
      <g transform="translate(33 34)" fill="none" stroke="#ff9557" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect width="26" height="20" rx="3"/>
        <path d="M8 26h10M13 20v6"/>
      </g>
      <text x="20" y="104" fill="#f4f7f8" font-size="19" font-weight="700">Browser</text>
      <text x="20" y="128" fill="#a7b3be" font-size="14">Static UI · status polling</text>
    </g>

    <path d="M269 227H356" fill="none" stroke="#7be0ca" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="312" y="210" text-anchor="middle" fill="#a7b3be" font-size="12">same-origin HTTP</text>

    <g transform="translate(366 137)" filter="url(#shadow)">
      <rect width="308" height="180" rx="22" fill="url(#panel)" stroke="#ff9557" stroke-width="2"/>
      <rect x="22" y="22" width="52" height="52" rx="14" fill="#ff9557" fill-opacity=".13"/>
      <path d="M38 38h20M38 48h20M38 58h13" fill="none" stroke="#ff9557" stroke-width="2.5" stroke-linecap="round"/>
      <text x="92" y="49" fill="#ff9557" font-size="12" font-weight="700" letter-spacing="1.4">CONTROL PLANE</text>
      <text x="92" y="72" fill="#f4f7f8" font-size="20" font-weight="700">FastAPI</text>
      <path d="M22 94H286" stroke="#263544"/>
      <text x="22" y="121" fill="#c3cbd2" font-size="14">• validated request/response models</text>
      <text x="22" y="145" fill="#c3cbd2" font-size="14">• bounded in-memory job snapshots</text>
      <text x="22" y="169" fill="#c3cbd2" font-size="14">• cancellation, expiry and cleanup</text>
    </g>

    <path d="M674 190H742" fill="none" stroke="#7be0ca" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M674 270H742" fill="none" stroke="#7be0ca" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(752 128)">
      <rect width="240" height="132" rx="18" fill="#101822" stroke="#385063" stroke-width="2"/>
      <circle cx="31" cy="34" r="12" fill="#7be0ca" fill-opacity=".18"/>
      <path d="m24 34 5 5 9-11" fill="none" stroke="#7be0ca" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="54" y="40" fill="#f4f7f8" font-size="17" font-weight="700">Policy boundary</text>
      <text x="22" y="72" fill="#a7b3be" font-size="13">URL · DNS · port · body</text>
      <text x="22" y="95" fill="#a7b3be" font-size="13">playlist · live · DRM · auth</text>
      <text x="22" y="118" fill="#a7b3be" font-size="13">size · duration · extractor</text>
    </g>

    <g transform="translate(752 278)">
      <rect width="240" height="132" rx="18" fill="#101822" stroke="#385063" stroke-width="2"/>
      <circle cx="31" cy="34" r="12" fill="#ff9557" fill-opacity=".18"/>
      <path d="M25 29h12M25 34h12M25 39h8" fill="none" stroke="#ff9557" stroke-width="2" stroke-linecap="round"/>
      <text x="54" y="40" fill="#f4f7f8" font-size="17" font-weight="700">Metadata extraction</text>
      <text x="22" y="72" fill="#a7b3be" font-size="13">yt-dlp · download disabled</text>
      <text x="22" y="95" fill="#a7b3be" font-size="13">normalized quality choices</text>
      <text x="22" y="118" fill="#a7b3be" font-size="13">sanitized public response</text>
    </g>

    <path d="M992 260h87v71" fill="none" stroke="#7be0ca" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1044" y="245" text-anchor="middle" fill="#a7b3be" font-size="12">admit job</text>

    <g transform="translate(1022 340)" filter="url(#shadow)">
      <rect width="194" height="190" rx="22" fill="url(#panel)" stroke="#7be0ca" stroke-width="2"/>
      <text x="22" y="38" fill="#7be0ca" font-size="12" font-weight="700" letter-spacing="1.4">ISOLATED WORKER</text>
      <text x="22" y="68" fill="#f4f7f8" font-size="20" font-weight="700">Child process</text>
      <path d="M22 88H172" stroke="#263544"/>
      <text x="22" y="116" fill="#c3cbd2" font-size="14">yt-dlp transfer</text>
      <text x="22" y="140" fill="#c3cbd2" font-size="14">FFmpeg mux / MP3</text>
      <text x="22" y="164" fill="#c3cbd2" font-size="14">progress events</text>
    </g>

    <path d="M1022 468H913" fill="none" stroke="#7be0ca" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(676 432)" filter="url(#shadow)">
      <rect width="227" height="124" rx="20" fill="url(#panel)" stroke="#385063" stroke-width="2"/>
      <path d="M23 40h24l8 10h34v40H23Z" fill="#7be0ca" fill-opacity=".12" stroke="#7be0ca" stroke-width="2" stroke-linejoin="round"/>
      <text x="105" y="48" fill="#f4f7f8" font-size="17" font-weight="700">Per-job storage</text>
      <text x="105" y="72" fill="#a7b3be" font-size="13">temporary streams</text>
      <text x="105" y="94" fill="#a7b3be" font-size="13">one final output file</text>
    </g>

    <path d="M676 494H451" fill="none" stroke="#7be0ca" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="565" y="478" text-anchor="middle" fill="#a7b3be" font-size="12">contained file response</text>

    <g transform="translate(173 425)">
      <rect width="268" height="142" rx="20" fill="#101822" stroke="#385063" stroke-width="2"/>
      <text x="22" y="38" fill="#ff9557" font-size="12" font-weight="700" letter-spacing="1.3">PUBLIC CONTRACT</text>
      <text x="22" y="69" fill="#f4f7f8" font-size="18" font-weight="700">Sanitized job snapshot</text>
      <text x="22" y="98" fill="#a7b3be" font-size="13">status · phase · progress · expiry</text>
      <text x="22" y="120" fill="#a7b3be" font-size="13">never source URL or local path</text>
    </g>

    <path d="M173 496H108V304" fill="none" stroke="#7be0ca" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
