[project]
name = "omnifetch"
version = "0.4.0"
description = "Universal media downloader and extractor"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "imageio-ffmpeg>=0.6.0,<0.7",
  "pydantic>=2.13.4,<3",
  "uvicorn[standard]>=0.52.0,<0.53",
  "yt-dlp[default,curl-cffi]>=2026.8.19,<2026.9",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = [
  "integration: exercises FFmpeg, the filesystem, or another local process",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/.venv", "backend/downloads"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]
ignore = [
  # FastAPI uses function calls in dependency defaults by design.
  "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
