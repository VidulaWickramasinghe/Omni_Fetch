[project]
name = "omnifetch"
version = "0.3.1"
description = "Universal media downloader and extractor"
readme = "README.md"
requires-python = ">=3.12,<3.15"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = [
  "integration: exercises FFmpeg, the filesystem, or another local process",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/.venv", "backend/downloads"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]
ignore = [
  # FastAPI uses function calls in dependency defaults by design.
  "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
